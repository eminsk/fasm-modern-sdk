name: Build & Release FASM Modern SDK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile FASM from source
        shell: cmd
        run: |
          build.bat

      - name: Create Windows Package
        shell: pwsh
        run: |
          Compress-Archive -Path bin, include, examples, README.md, LICENSE -DestinationPath fasm-modern-sdk-windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fasm-modern-sdk-windows-x64
          path: fasm-modern-sdk-windows-x64.zip

  build-linux:
    name: Build Linux x64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install FASM & Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fasm gcc-multilib

      - name: Build FASM for Linux
        run: |
          mkdir -p bin
          cd src/fasm1/LINUX/X64
          fasm fasm.asm ../../../../bin/fasm-linux-x64
          chmod +x ../../../../bin/fasm-linux-x64

      - name: Package Linux SDK
        run: |
          tar -czvf fasm-modern-sdk-linux-x64.tar.gz bin/ include/ examples/ README.md LICENSE

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fasm-modern-sdk-linux-x64
          path: fasm-modern-sdk-linux-x64.tar.gz

  build-macos:
    name: Build macOS x64
    runs-on: macos-13
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Package macOS SDK
        run: |
          mkdir -p bin
          tar -czvf fasm-modern-sdk-macos-x64.tar.gz bin/ include/ examples/ README.md LICENSE

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fasm-modern-sdk-macos-x64
          path: fasm-modern-sdk-macos-x64.tar.gz

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            fasm-modern-sdk-windows-x64/fasm-modern-sdk-windows-x64.zip
            fasm-modern-sdk-linux-x64/fasm-modern-sdk-linux-x64.tar.gz
            fasm-modern-sdk-macos-x64/fasm-modern-sdk-macos-x64.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
